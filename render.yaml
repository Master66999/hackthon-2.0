services:
  # 1. Python AI Vision Backend (Port 5001)
  - type: web
    name: leafsense-vision-ai
    env: python
    region: singapore
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && gunicorn vision_app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PORT
        value: 5001

  # 2. Node Express Authentication & Data Server (Port 5000)
  - type: web
    name: leafsense-node-api
    env: node
    region: singapore
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: PORT
        value: 5000

  # 3. Vite React Web App Frontend
  - type: web
    name: leafsense-web
    env: static
    region: singapore
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
